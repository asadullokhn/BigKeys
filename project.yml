name: Typikey
options:
  bundleIdPrefix: com.asadullokh.ch5
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: Y7ZZ5G2T3Y
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Typikey:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Typikey
        # TestFlight: answers the export-compliance question at upload time.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Bundle ids predate the Typikey rename and stay put on purpose:
        # the keyboard's enabled state on every device is keyed to them,
        # and users never see them. The App Store Connect record binds to
        # this id.
        PRODUCT_BUNDLE_IDENTIFIER: com.asadullokh.ch5.bigkeys
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TypikeyKeyboard
        embed: true
  TypikeyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Typikey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asadullokh.ch5.bigkeys.uitests
        TEST_TARGET_NAME: Typikey
  TypikeyKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Typikey
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asadullokh.ch5.bigkeys.keyboard
schemes:
  Typikey:
    build:
      targets:
        Typikey: all
        TypikeyUITests: [test]
    test:
      targets:
        - TypikeyUITests
